[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-room-audit"
version = "0.1.0"
description = "Read-only Technocore room export audit"
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[tool.setuptools]
py-modules = ["audit"]
